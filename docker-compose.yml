services:
  backend:
    build:
      context: .
      target: backend
    env_file:
      - backend/.env
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  backend_data:
